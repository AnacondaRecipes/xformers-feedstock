{% set name = "xformers" %}
{% set version = "0.0.34" %}
{% set build_number = 0 %}
{% set cuda_enabled = (gpu_variant or "none") == "cuda" %}
{% set build = build_number + 100 if cuda_enabled else build_number %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 716bd9ffe61f46c2cc0536abf8b8c43ec594bea47a49394ea5cfa417e9de6a6f
  # The xformers 0.0.34 sdist bundles cutlass headers and flash-attention sources
  # under third_party/ but omits their LICENSE files; fetch separately to satisfy
  # license_file in about:. cutlass version confirmed via
  # third_party/cutlass/include/cutlass/version.h (MAJOR/MINOR/PATCH = 4.3.0).
  # Pin to the exact tag/commit — do NOT fetch from `main` (copyright-year edits
  # drift the SHA and break builds).
  - url: https://raw.githubusercontent.com/NVIDIA/cutlass/v4.3.0/LICENSE.txt
    sha256: 80a7a18b73d41f64dd9ca881af35938f8de88b18c728703251f4c94d1299884d
    folder: third_party/cutlass
    file_name: LICENSE.txt
  # flash-attention pinned at xformers v0.0.34's submodule commit (de1584b);
  # the sdist has no version.txt, so pin the raw URL to that exact commit.
  - url: https://raw.githubusercontent.com/Dao-AILab/flash-attention/de1584b5328321189a4d7832fe29bbd6813bf6ed/LICENSE
    sha256: 8c9ccb96c065e706135b6cbad279b721da6156e51f3a5f27c6b3329af9416d73
    folder: third_party/flash-attention
    file_name: LICENSE

build:
  number: {{ build }}
  # CUDA variant is linux-64 only (matches pytorch's xformers platform support).
  # CPU variant builds on linux-64/linux-aarch64/osx-arm64. No Windows support.
  # py310-py314 (full pytorch 2.10.0 coverage on pkgs/main).
  skip: true  # [py<310 or win or (gpu_variant == "cuda" and not (linux and x86_64))]
  string: cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build }}  # [gpu_variant == "cuda"]
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build }}                                                  # [gpu_variant != "cuda"]
  # Pass the variant keys into the build env so build.sh can branch on
  # gpu_variant without second-guessing cuda_compiler_version. (script_env
  # whitelists vars for pass-through; it cannot *override* a variant value.)
  script_env:
    - package_version={{ version }}
    - gpu_variant={{ gpu_variant }}
    - cuda_compiler_version={{ cuda_compiler_version }}   # [gpu_variant == "cuda"]
  # CUDA *-dev packages have run_exports that would pin cuda-cudart/libcublas/etc.
  # into xformers' run deps. pytorch's own run deps already bring in the runtime
  # CUDA libraries, so we suppress the duplicate bounds here.
  ignore_run_exports_from:                         # [gpu_variant == "cuda"]
    - cuda-nvrtc-dev                               # [gpu_variant == "cuda"]
    - cuda-nvtx-dev                                # [gpu_variant == "cuda"]
    - libcublas-dev                                # [gpu_variant == "cuda"]
    - libcufft-dev                                 # [gpu_variant == "cuda"]
    - libcurand-dev                                # [gpu_variant == "cuda"]
    - libcusolver-dev                              # [gpu_variant == "cuda"]
    - libcusparse-dev                              # [gpu_variant == "cuda"]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - {{ compiler('cuda') }}                       # [gpu_variant == "cuda"]
    - git

  host:
    - python
    - pip
    - setuptools
    - wheel
    # xformers 0.0.34 wheel metadata requires `torch==2.10.0` exactly; pin pytorch
    # 2.10.0 so the linked CUDA runtime matches across host/run. pytorch 2.10.0 on
    # pkgs/main ships cpu_openblas/cpu_mkl and gpu_cuda128/gpu_cuda130. Per Eric
    # Lundby's review tips on AnacondaRecipes/vllm-feedstock#3, pin libtorch
    # host-only with the BLAS/CUDA sub-variant to avoid overlinking.
    # CPU BLAS: cpu_mkl is x86_64-only (MKL doesn't ship for ARM); use cpu_openblas
    # elsewhere. Matches torchao so downstreams (unsloth) needing both resolve a single
    # pytorch CPU build. See review-pr GUIDELINES Common Issues #32.
    - pytorch 2.10.0=cpu_mkl*                                                   # [gpu_variant != "cuda" and (linux or win) and x86_64]
    - pytorch 2.10.0=cpu_openblas*                                              # [gpu_variant != "cuda" and not ((linux or win) and x86_64)]
    - pytorch 2.10.0=gpu_cuda{{ cuda_compiler_version | replace('.', '') }}*    # [gpu_variant == "cuda"]
    - libtorch 2.10.0=cpu_mkl*                                                  # [gpu_variant != "cuda" and (linux or win) and x86_64]
    - libtorch 2.10.0=cpu_openblas*                                             # [gpu_variant != "cuda" and not ((linux or win) and x86_64)]
    - libtorch 2.10.0=gpu_cuda{{ cuda_compiler_version | replace('.', '') }}*   # [gpu_variant == "cuda"]
    # CUDA development headers and libraries (linking only; runtime comes via pytorch).
    - cuda-version =={{ cuda_compiler_version }}   # [gpu_variant == "cuda"]
    - cuda-cudart-dev                              # [gpu_variant == "cuda"]
    - cuda-nvrtc-dev                               # [gpu_variant == "cuda"]
    - cuda-nvtx-dev                                # [gpu_variant == "cuda"]
    - cuda-nvml-dev                                # [gpu_variant == "cuda"]
    - libcublas-dev                                # [gpu_variant == "cuda"]
    - libcufft-dev                                 # [gpu_variant == "cuda"]
    - libcurand-dev                                # [gpu_variant == "cuda"]
    - libcusolver-dev                              # [gpu_variant == "cuda"]
    - libcusparse-dev                              # [gpu_variant == "cuda"]

  run:
    # Upstream deps (xformers 0.0.34 wheel metadata): numpy, torch==2.10.0.
    # The exact torch pin is upstream's, not ours — 0.0.34 is the torch-2.10 pairing.
    - python
    - numpy
    - pytorch 2.10.0=cpu_mkl*                                                  # [gpu_variant != "cuda" and (linux or win) and x86_64]
    - pytorch 2.10.0=cpu_openblas*                                             # [gpu_variant != "cuda" and not ((linux or win) and x86_64)]
    - pytorch 2.10.0=gpu_cuda{{ cuda_compiler_version | replace('.', '') }}*   # [gpu_variant == "cuda"]
    # Hard, unbounded __cuda gate so the CUDA build is excluded from non-GPU
    # hosts (version is cuda-version's job, not __cuda's).
    - __cuda                                       # [gpu_variant == "cuda"]
    # libtorch intentionally omitted from run — pytorch's run_exports pull it in
    # with the correct ABI bound. Listing it here would cause overlinking.

test:
  requires:
    - pip
  imports:
    - xformers
    - xformers.ops
  commands:
    - pip check
    - python -m xformers.info

about:
  home: https://github.com/facebookresearch/xformers
  summary: "XFormers: A collection of composable Transformer building blocks."
  description: |
    xFormers is a PyTorch-based library which hosts flexible Transformer building
    blocks. They are interoperable and optimized building blocks, which can be
    optionally combined to create some state of the art models (e.g. MHA attention
    mechanisms, sparsity-aware or long-context variants).
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - third_party/cutlass/LICENSE.txt
    - third_party/flash-attention/LICENSE
  doc_url: https://facebookresearch.github.io/xformers
  dev_url: https://github.com/facebookresearch/xformers

extra:
  recipe-maintainers:
    - jan-janssen
    - h-vetinari
    - bkreider
