# pytorch 2.10.0 on pkgs/main ships gpu_cuda128 and gpu_cuda130 builds. xformers
# links against pytorch/libtorch and must use the same CUDA runtime, so we build
# one CUDA variant per pytorch CUDA flavor (12.8 and 13.0), overriding the
# aggregate CBC default. CUDA variants are linux-64 only — matching pytorch's
# xformers platform support and the prior 0.0.30 scope. The CPU variant also
# builds on linux-aarch64 and osx-arm64.
#
# The `none` default is deliberately UN-gated: the aggregate root CBC sets
# cuda_compiler_version on `[linux or (win and x86_64)]` (which includes
# linux-aarch64), and per-key REPLACEMENT semantics mean our list must cover
# every platform or root's [12.9, 13.0] leaks through un-zipped on aarch64 and
# produces duplicate CPU builds. Keeping `none` un-gated collapses aarch64/osx
# to a single CPU variant. cuda_compiler is inherited from the root CBC.
gpu_variant:
  - none
  - cuda                       # [linux and x86_64]
  - cuda                       # [linux and x86_64]

cuda_compiler_version:
  - none
  - 12.8                       # [linux and x86_64]
  - 13.0                       # [linux and x86_64]

zip_keys:                      # [linux and x86_64]
  -                            # [linux and x86_64]
    - gpu_variant              # [linux and x86_64]
    - cuda_compiler_version    # [linux and x86_64]
