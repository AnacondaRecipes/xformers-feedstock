# The slowest build on the previous head (aa3d795) took 15 min (win-64 CUDA). 4 hours
# leaves room for the new linux-aarch64 CUDA builds and slow workers.
task_timeout: 14400  # 4 hours

# Opt into the aggregate CBC's py3.15 entries (python/numpy zip).
build_env_vars:
  ANACONDA_ROCKET_ENABLE_PY315: yes
