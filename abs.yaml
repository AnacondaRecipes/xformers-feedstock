# CUDA variants compile 9-10 GPU architectures each (TORCH_CUDA_ARCH_LIST in recipe/build.sh)
# — needs an extended timeout to avoid being killed at the default PBP build timeout.
# 12 hours matches the onnxruntime CUDA build budget.
task_timeout: 43200  # 12 hours

# Opt into the aggregate CBC's py3.15 entries (python/numpy zip).
build_env_vars:
  ANACONDA_ROCKET_ENABLE_PY315: yes
